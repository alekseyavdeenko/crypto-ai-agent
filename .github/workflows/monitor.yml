name: XBO QA Monitor

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      DEV_URL: ${{ secrets.DEV_URL }}
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HEADLESS: "true"
      LISTEN_SECONDS: "60"
      RETRY_LISTEN_SECONDS: "30"
      MIN_TRACKED_PAIRS_WITH_UPDATES: "2"
      TARGET_SYMBOLS: "BTC/USDT,ETH/USDT,BTC/USDC,XRP/USDT,DOGE/BTC"
      AI_MODEL: "gpt-4.1-mini"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run AI QA Agent
        run: python ai_agent.py
